name: CI/CD pipeline for WeTube Backend Service

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Backend Service
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ steps.build-image.outputs.IMAGE_NAME }}
      IMAGE_TAG: ${{ steps.build-image.outputs.IMAGE_TAG }}
    steps:
#      - name: Print Image Info
#        run: |
#          echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/wetube-service, IMAGE_TAG=${{ github.sha }}"
#          echo "IMAGE_NAME=$IMAGE_NAME, IMAGE_TAG=$IMAGE_TAG"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push image to Docker Hub
        id: build-image
        run: |
          ./gradlew bootJar
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/wetube-service
          IMAGE_TAG=${{ github.sha }}

          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "compose.yml"
          target: "WeTube-service"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build.outputs.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Set environment variables explicitly with fallback
            export IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/wetube-service"
            export IMAGE_TAG="${{ github.sha }}"

            echo "Deploying with Image: $IMAGE_NAME:$IMAGE_TAG"

            echo "Final deployment values:"
            echo "IMAGE_NAME: $IMAGE_NAME"
            echo "IMAGE_TAG: $IMAGE_TAG"

            # Verify variables are set
            if [[ -z "$IMAGE_NAME" || -z "$IMAGE_TAG" ]]; then
              echo "❌ Environment variables not set correctly"
              echo "IMAGE_NAME: '$IMAGE_NAME'"
              echo "IMAGE_TAG: '$IMAGE_TAG'"
              exit 1
            fi

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo yum update -y
              sudo yum install docker -y
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -a -G docker $USER
              echo "Docker installed successfully"
            fi

            # Install Docker Compose if not present
            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose  # For compatibility
              echo "Docker Compose installed successfully"
            fi

            # Use sudo for Docker commands (user may not be in group yet; relogin needed otherwise)
            echo "Checking Docker status..."
            sudo docker --version
            sudo docker-compose version || sudo docker-compose --version

            # Navigate to project directory
            cd WeTube-service

            # Verify files were copied
            echo "Checking copied files..."
            ls -la
            if [[ ! -f "compose.yml" ]]; then
              echo "❌ compose.yml not found in target directory"
              exit 1
            fi

            # Create .env file from GitHub secrets
            echo "Creating production environment file..."
            cat > .env.prod.properties << EOF
            SPRING_PROFILES_ACTIVE=prod
            
            # --- Database ---
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DIALECT=${{ secrets.DB_DIALECT }}
            DB_DRIVER=${{secrets.DB_DRIVER}}
            
            # --- REDIS ---
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DATABASE=${{ secrets.REDIS_DATABASE }}
            REDIS_TIMEOUT=${{ secrets.REDIS_TIMEOUT }}
            
            # --- CORS ---
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            CORS_ALLOWED_METHODS=${{ secrets.CORS_ALLOWED_METHODS }}
            CORS_ALLOWED_HEADERS=${{ secrets.CORS_ALLOWED_HEADERS }}
            CORS_EXPOSED_HEADERS=${{ secrets.CORS_EXPOSED_HEADERS }}
            CORS_ALLOW_CREDENTIALS=${{ secrets.CORS_ALLOW_CREDENTIALS }}
            
            # --- Cloudinary ---
            CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            
            # --- LiveKit ---
            LIVEKIT_WS_URL=${{ secrets.LIVEKIT_WS_URL }}
            LIVEKIT_API_URL=${{ secrets.LIVEKIT_API_URL }}
            LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
            LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
            
            # --- Google OAuth ---
            CLIENT_ID=${{ secrets.CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
            
            # --- Momo ---
            PARTNER_CODE=${{ secrets.PARTNER_CODE }}
            ACCESS_KEY=${{ secrets.ACCESS_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ENDPOINT=${{ secrets.ENDPOINT }}
            REDIRECT_URL=${{ secrets.REDIRECT_URL }}
            IP_URL=${{ secrets.IP_URL }}
            
            # --- Elasticsearch ---
            ELASTICSEARCH_URL=${{ secrets.ELASTICSEARCH_URL }}
            ELASTICSEARCH_API_KEY=${{ secrets.ELASTICSEARCH_API_KEY }}
            ELASTIC_USERNAME=${{ secrets.ELASTIC_USERNAME }}
            ELASTIC_PASSWORD=${{ secrets.ELASTIC_PASSWORD }}
            
            # --- Spring Security OAuth Details ---
            SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE }}
            SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI }}
            SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_AUTHENTICATION_METHOD=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_AUTHENTICATION_METHOD }}
            SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_AUTHORIZATION_GRANT_TYPE=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_AUTHORIZATION_GRANT_TYPE }}
            
            SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI }}
            SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI }}
            SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_INFO_URI=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_INFO_URI }}
            SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI }}
            SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_NAME_ATTRIBUTE=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_NAME_ATTRIBUTE }}
  
            # --- Frontend URL ---
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            
            IMAGE_NAME=${IMAGE_NAME}
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            echo "✅ Environment file created"       
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
            echo "✅ Dừng và xóa container cũ (nếu có)"
            sudo docker-compose --env-file .env.prod down || true
            
            echo "✅ Pull image mới"
            sudo docker-compose --env-file .env.prod.properties pull
            
            echo "✅ Chạy container mới"
            sudo docker-compose --env-file .env.prod.properties up -d --remove-orphans

#            # Stop and remove existing containers
#            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker-compose stop backend || true
#            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker-compose rm -f backend || true
#
#            # Create the external network if it doesn't exist (new addition to fix the error)
#            sudo docker network create web-network || true
#
#            # Pull latest image
#            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker-compose pull backend
#
#            # Start new containers
#            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker-compose up -d --remove-orphans
#
#            # Show running containers
#            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker-compose ps
#
#            # Show logs for debugging
#            echo "Container logs:"
#            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker-compose logs backend --tail=50
