name: CI/CD pipeline for WeTube Backend Service

on:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build Backend Service
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ steps.build-image.outputs.IMAGE_NAME }}
      IMAGE_TAG: ${{ steps.build-image.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push image to Docker Hub
        id: build-image
        run: |
          ./gradlew bootJar
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/wetube-service
          IMAGE_TAG=${{ github.sha }}
          
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG
          
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
  

  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "compose.yml,.env.prod"
          target: "~/WeTube-service"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd my-app
            
            # Xuất các biến môi trường từ job 'build'
            export IMAGE_NAME=${{ needs.build.outputs.IMAGE_NAME }}
            export IMAGE_TAG=${{ needs.build.outputs.IMAGE_TAG }}
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            docker-compose stop backend || true
            docker-compose rm -f backend || true
            
            # Kéo image mới nhất
            docker-compose pull backend
            
            # Khởi động container mới
            docker-compose up -d --remove-orphans
