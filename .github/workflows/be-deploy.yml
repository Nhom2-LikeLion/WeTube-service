name: CI/CD pipeline for WeTube Backend Service

on:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build Backend Service
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ steps.build-image.outputs.IMAGE_NAME }}
      IMAGE_TAG: ${{ steps.build-image.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push image to Docker Hub
        id: build-image
        run: |
          ./gradlew bootJar
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/wetube-service
          IMAGE_TAG=${{ github.sha }}
          
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG
          
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
  

  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify files exist
        run: |
          echo "Checking if required files exist..."
          ls -la
          if [[ -f "compose.yml" ]]; then
            echo "✅ compose.yml found"
          else
            echo "❌ compose.yml not found"
            exit 1
          fi

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "compose.yml"
          target: "WeTube-service"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Debug: Show what we're receiving from build job
            echo "=== DEBUG: Build job outputs ==="
            echo "Raw IMAGE_NAME output: '${{ needs.build.outputs.IMAGE_NAME }}'"
            echo "Raw IMAGE_TAG output: '${{ needs.build.outputs.IMAGE_TAG }}'"
            
            # Set environment variables explicitly
            IMAGE_NAME="${{ needs.build.outputs.IMAGE_NAME }}"
            IMAGE_TAG="${{ needs.build.outputs.IMAGE_TAG }}"
            
            # Fallback: Reconstruct IMAGE_NAME if empty
            if [[ -z "$IMAGE_NAME" ]]; then
              echo "⚠️ IMAGE_NAME is empty, reconstructing..."
              IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/wetube-service"
              echo "Reconstructed IMAGE_NAME: $IMAGE_NAME"
            fi
            
            # Fallback: Use commit SHA if IMAGE_TAG is empty
            if [[ -z "$IMAGE_TAG" ]]; then
              echo "⚠️ IMAGE_TAG is empty, using GitHub SHA..."
              IMAGE_TAG="${{ github.sha }}"
              echo "Using IMAGE_TAG: $IMAGE_TAG"
            fi
            
            echo "Deploying with:"
            echo "IMAGE_NAME: $IMAGE_NAME"
            echo "IMAGE_TAG: $IMAGE_TAG"
            
            # Verify variables are set
            if [[ -z "$IMAGE_NAME" || -z "$IMAGE_TAG" ]]; then
              echo "❌ Environment variables not set correctly"
              echo "IMAGE_NAME: '$IMAGE_NAME'"
              echo "IMAGE_TAG: '$IMAGE_TAG'"
              exit 1
            fi
            
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo yum update -y
              sudo yum install docker -y
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -a -G docker $USER
              echo "Docker installed successfully"
            fi
            
            # Install Docker Compose if not present
            if ! command -v docker-compose &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              echo "Docker Compose installed successfully"
            fi
            
            # Use sudo for Docker commands since user might not be in docker group yet
            echo "Checking Docker status..."
            sudo docker --version
            sudo docker-compose --version || sudo docker compose version
            
            # Navigate to project directory
            cd WeTube-service
            
            # Verify files were copied
            echo "Checking copied files..."
            ls -la
            if [[ ! -f "compose.yml" ]]; then
              echo "❌ compose.yml not found in target directory"
              exit 1
            fi
            
            # Create .env file from GitHub secrets
            echo "Creating production environment file..."
            cat > .env.prod << EOF
            SPRING_PROFILES_ACTIVE=prod
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DATABASE=${{ secrets.REDIS_DATABASE }}
            REDIS_TIMEOUT=${{ secrets.REDIS_TIMEOUT }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            CORS_ALLOWED_METHODS=${{ secrets.CORS_ALLOWED_METHODS }}
            CORS_ALLOWED_HEADERS=${{ secrets.CORS_ALLOWED_HEADERS }}
            CORS_EXPOSED_HEADERS=${{ secrets.CORS_EXPOSED_HEADERS }}
            CORS_ALLOW_CREDENTIALS=${{ secrets.CORS_ALLOW_CREDENTIALS }}
            JWKS_URL=${{ secrets.JWKS_URL }}
            EOF
            
            echo "✅ Environment file created"
            
            # Export environment variables from build job
            export IMAGE_NAME=${{ needs.build.outputs.IMAGE_NAME }}
            export IMAGE_TAG=${{ needs.build.outputs.IMAGE_TAG }}
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Stop and remove existing containers
            sudo docker-compose stop backend || true
            sudo docker-compose rm -f backend || true
            
            # Pull latest image
            sudo docker-compose pull backend
            
            # Start new containers
            sudo docker-compose up -d --remove-orphans