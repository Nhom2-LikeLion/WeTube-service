services:
  backend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: wetube-backend-container
    depends_on:
      mysql:
        condition: service_healthy
    ports:
    - 8080:8080
    env_file:
    - .env.prod.properties
    restart: always
    networks:
    - web-network
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${secrets.DB_PASSWORD}
      MYSQL_DATABASE: ${secrets.DB_NAME}
      MYSQL_USER: ${secrets.DB_USERNAME}
      MYSQL_PASSWORD: ${secrets.DB_PASSWORD}
    ports:
    - 3306:3306
    volumes:
    - mysql_data:/var/lib/mysql
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      timeout: 20s
      retries: 10
networks:
  web-network:
    external: true
volumes:
  mysql_data: null
  es_data: null
version: '3.8'