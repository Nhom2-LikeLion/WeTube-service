services:
  backend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: wetube-backend-container
    ports:
    - 8080:8080
    env_file:
    - .env.prod.properties
    restart: always
    networks:
    - web-network
networks:
  web-network:
    external: true
volumes:
  mysql_data: null
  es_data: null
version: '3.8'